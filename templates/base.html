<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Financial Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .card-header {
            font-weight: 600;
        }
        .gain-positive {
            color: #198754;
        }
        .gain-negative {
            color: #dc3545;
        }
        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
        }
        .location-card {
            border-left: 4px solid #0d6efd;
            margin-bottom: 1.5rem;
        }
        .location-card.etrade {
            border-left-color: #0d6efd;
        }
        .location-card.coinbase {
            border-left-color: #0052ff;
        }
        .location-card.hardwallet {
            border-left-color: #6f42c1;
        }
        .stat-card {
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        footer {
            margin-top: 3rem;
            padding: 2rem 0;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Financial Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stocks">E*Trade</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/crypto-coinbase">Coinbase</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/crypto-l">L Wallet</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/portfolio">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/update-prices" onclick="return confirm('Update all prices? This may take a minute.')">Update Prices</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container text-center text-muted">
            <small>
                {% if last_update %}
                Last price update: {{ last_update.strftime('%Y-%m-%d %I:%M %p') }}
                {% endif %}
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
